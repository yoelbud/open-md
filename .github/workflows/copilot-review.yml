name: Request Copilot PR review

# Ask Copilot to review pull requests as they open. Requires Copilot code review
# to be enabled for the repository; the job is best-effort and will not fail the
# workflow if the feature is unavailable. Skips draft PRs.

on:
  pull_request:
    types: [opened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  request-review:
    name: Request Copilot review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Request review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$OWNER/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -f "reviewers[]=copilot-pull-request-reviewer[bot]"; then
            echo "Requested Copilot review."
          else
            echo "Copilot code review is not available for this repository; skipping."
          fi
