# Path-based labels for PRs. Pairs with .github/CODEOWNERS review routing.
# Used by .github/workflows/labeler.yml (actions/labeler).

"area: rust":
  - changed-files:
      - any-glob-to-any-file:
          - "crates/**"
          - "Cargo.toml"
          - "Cargo.lock"
          - "rust-toolchain.toml"

"area: frontend":
  - changed-files:
      - any-glob-to-any-file:
          - "frontend/**"

"area: docs":
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "LICENSE-*"

"area: ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - ".cargo/**"
          - "crates/xtask/**"

"area: agentic":
  - changed-files:
      - any-glob-to-any-file:
          - "AGENTS.md"
          - ".github/agents/**"
          - ".github/skills/**"
          - ".github/instructions/**"
          - ".github/copilot-instructions.md"
