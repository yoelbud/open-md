[package]
name = "om-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "open-md desktop application (Tauri shell + IPC)"

# The actual Tauri app will live here. M0 ships a small CLI that exercises the
# core/render crates so the workspace builds end-to-end without requiring the
# Tauri toolchain to be installed yet. Tauri wiring is added in M1.

[[bin]]
name = "om-app"
path = "src/main.rs"

[dependencies]
om-core = { path = "../om-core" }
om-render = { path = "../om-render" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
