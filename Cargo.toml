[workspace]
resolver = "2"
members = [
    "crates/om-core",
    "crates/om-render",
    "crates/om-engine",
    "crates/om-wasm",
    "crates/om-app",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yoelbud/open-md"
rust-version = "1.78"

# Strict, exact pinning. We want reproducible builds and explicit upgrades.
[workspace.dependencies]
pulldown-cmark = { version = "=0.12.2", default-features = false, features = ["html"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
rmp-serde = "=1.3.0"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
thiserror = "=1.0.69"
anyhow = "=1.0.102"
tauri = "=2.11.2"
tauri-build = "=2.6.2"
rfd = "=0.17.2"
wasm-bindgen = "=0.2.122"

# Dev-only deps shared across crates.
insta = { version = "=1.41.1", features = ["yaml"] }
proptest = "=1.5.0"

# Workspace-wide lint configuration. Each crate opts in with `lints.workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unused_import_braces = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Pragmatic opt-outs that produce noise without buying safety.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
multiple_crate_versions = "allow"
cargo_common_metadata = "allow"
negative_feature_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
